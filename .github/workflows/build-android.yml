name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore WordTileScorer.App/WordTileScorer.App.csproj

      - name: Run core checks
        run: dotnet run --project WordTileScorer.Core.SelfTest/WordTileScorer.Core.SelfTest.csproj --configuration Release

      - name: Build APK
        run: |
          base64 --decode .github/dev-signing.keystore.b64 > "$RUNNER_TEMP/wordtiles-dev.keystore"
          dotnet publish WordTileScorer.App/WordTileScorer.App.csproj \
            --framework net10.0-android \
            --configuration Release \
            --runtime android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/wordtiles-dev.keystore" \
            -p:AndroidSigningStorePass=WordTilesDev2026 \
            -p:AndroidSigningKeyAlias=wordtilesdev \
            -p:AndroidSigningKeyPass=WordTilesDev2026
          cp WordTileScorer.App/bin/Release/net10.0-android/android-arm64/publish/*-Signed.apk WordTileScorer-Android-v0.3.6-PERSISTENT-RACKS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordTileScorer-Android-v0.3.6-PERSISTENT-RACKS
          path: WordTileScorer-Android-v0.3.6-PERSISTENT-RACKS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct GitHub download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.6
          name: Word Tile Scorer v0.3.6 — Persistent Player Racks
          files: WordTileScorer-Android-v0.3.6-PERSISTENT-RACKS.apk
          fail_on_unmatched_files: true
